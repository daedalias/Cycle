<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cycle v7</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="app">

        <section class="prediction">
            <div class="label">Next Expected</div>
            <div class="date">September 24</div>
        </section>

        <section class="month-header">
            <button id="prevMonth">‹</button>
            <h1 id="monthTitle">September 2026</h1>
            <button id="nextMonth">›</button>
        </section>

        <section id="calendar"></section>

        <section class="stats">
            <div class="stat">
                <span>Recorded Starts</span>
                <span>0</span>
            </div>

            <div class="stat">
                <span>Average Cycle</span>
                <span>--</span>
            </div>

            <div class="stat">
                <span>Last Start</span>
                <span>--</span>
            </div>
        </section>

    </main>

<script type="module" src="app.js"></script>

</body>
</html>
