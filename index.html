<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cycle v14</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="app">

        <section class="prediction">
            <div class="label">Next Expected</div>
<div
    class="date"
    id="predictionDate"
>
    --
</div>

        <section class="month-header">

            <h1 id="monthTitle">September 2026</h1>

        <section id="calendar"></section>

<section class="stats">

        <span id="recordedStarts">0</span>
    </div>

    </div>

    <div class="stat">
        <span>Shortest Cycle</span>
        <span id="shortestCycle">--</span>
    </div>

    <div class="stat">
        <span>Longest Cycle</span>
        <span id="longestCycle">--</span>
    </div>

    <div class="stat">
        <span>Last Start</span>
        <span id="lastStart">--</span>
    </div>

</section>

    </main>
